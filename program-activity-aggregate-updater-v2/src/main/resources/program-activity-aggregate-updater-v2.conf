# program-activity-aggregate-updater-v2 config
include "base-config.conf"

kafka {
  input.topic = "sunbirddev.coursebatch.job.request.v2"
  output.audit.topic = "sunbirddev.telemetry.raw"
  output.failed.topic = "sunbirddev.activity.agg.failed"
  output.certissue.topic = "sunbirddev.issue.certificate.request"
  groupId = "sunbirddev-program-activity-aggregate-updater-v2-group"
}


lms-cassandra {
  keyspace = "sunbird_courses"
  consumption.table = "user_content_consumption"
  user_activity_agg.table = "user_activity_agg"
  user_enrolments.table = "user_enrolments_v2"
}

user_enrolments {
  userid.column   = "userid"
  courseid.column = "courseid"
  batchid.column  = "batchid"
  status.column   = "status"
}

cassandra.consistency.level     = "LOCAL_QUORUM"
enrolment.batch.read.enabled    = true
enrolment.batch.read.chunk.size = 50

redis {
  database {
    relationCache.id = 10
  }
}

dedup-redis {
  host = 11.2.4.22
  port = 6379
  database.index = 3
  database.expiry = 604800
}

threshold.batch.read.interval = 60 // In sec
threshold.batch.read.size = 1000
threshold.batch.write.size = 10

activity {
  module.aggs.enabled = true
  input.dedup.enabled = true
  filter.processed.enrolments = true
  collection.status.cache.expiry = 3600
}

service {
  content.basePath = "http://11.2.6.6/content"
  search.basePath = "http://11.2.6.6/search"
}


# Cassandra connection timeouts
lms-cassandra.read.timeout.ms    = 8000
lms-cassandra.connect.timeout.ms = 3000
lms-cassandra.max.retries        = 3

# Timer-based micro-batching: flush pending events every N ms
processing.timer.interval.ms     = 500

# Feature flag: use optimised single-partition batch read for enrolment status
enrolment.batch.read.enabled     = true

# V2 parallelism
task.consumer.parallelism           = 4
task.dedup.parallelism              = 8
task.activity.agg.parallelism       = 16
task.enrolment.complete.parallelism = 8
task.window.shards                  = 16

